# baselines/pick_place/dls-ik.yaml — DLS 数值 IK 相位机基线（M2）
method: dls-ik
task_id: pick_place@v1
entry: >
  cargo run -p oriera-agent --example embodied_sim_baseline --features rigid3d,spec,urdf --
  --spec crates/oriera-embodied/specs/official/<preset>.json --protocol course@v1
  --reference-out results/reference
presets:
  - name: tabletop-4dof-pick      # 金标桌面（4 轴）——走 DLS 也须 ≥90%
    spec: crates/oriera-embodied/specs/official/tabletop-4dof-pick.json
    gate: 0.90
  - name: panda-7dof-pick         # Panda 7 轴 + gripper2f（--dump-panda-spec 生成）
    spec: crates/oriera-embodied/specs/official/panda-7dof-pick.json
    gate: 0.75
  - name: panda-contact-criterion # P2-Wave2 升格官方（95f75626）：同 panda-7dof-pick 仅 holding
                                  # 标签换 Contact 判据（双板法向力 ≥1.0 N ∧ 滑速 ≤0.05 m/s）
    spec: crates/oriera-embodied/specs/official/panda-contact-criterion.json
    gate: 0.75                    # 判据换装不换闸：pick_place@v1 success=在区、不读 holding；
                                  # 两口径同 seeds 逐集零翻转（course 12 集 + paper 100 集）
eval:
  protocol: course@v1
  episodes: 12
  seed0: 1000
  success_criteria: v1            # 预设任务是 pick_place@v1（@v2 换 task.id 即可，判据随注册表）
  verify_determinism: full
train:
  seeds: null                     # 脚本类基线无训练
hyperparams:
  ik:
    solver: damped-least-squares
    rows: 6                       # 3 位置 + 3 工具朝向（期望世界 -Y）
    rot_weight: 0.5
    lambda: 0.05
    max_step_rad: 0.3
    eps_rad: 1.0e-4
    max_iterations: 300
    tol_pos_m: 1.0e-4
    tol_rot: 2.0e-3
    warm_start: previous-solution # 每 tick 从上一解起步
  phases: pick_phases             # 8 相（4 轴金标路）：above 0.12 → 0.03 → 闭爪 → 提 0.20 → 移到 goal 0.20 → 降 0.06 → 开爪 → 退 0.22
  dwell_ticks: [70, 60, 40, 70, 95, 70, 35, 45]
  heavy_pick_schedule:            # ≥6 DoF（Panda）专用排程（P1-B2 paper 口径调参，2026-11-04）；
                                  # 4 轴金标路不进这段，逐位不动
    rate_limit_rad_per_tick: 0.028
    grasp_depth_m: 0.0
    dwell_ticks: [90, 80, 15, 80, 40, 40, 70, 95, 70, 35, 50]  # 悬停/下探(沉降重标定)/沉降(钉目标)/闭爪/三级抬升 0.05/0.11/0.20(钉目标)/移/降/开/退
    mechanisms: [hover-sag-calibration, descent-end-recalibration, closing-pin, staged-lift, rate-limit, lost-solver-reanchor]
reference: results/reference/<spec_hash8>/course_v1.json
notes: >
  相位机与 collect 的解析 IK 金标同一套 waypoint/dwell（可直接对比两条 IK 路的成功率）；
  任何 N-DoF RobotSpec 都吃——Panda 预设靠它（≥6 DoF 走 heavy 排程：paper@v1 100 集
  80/100，Wilson [71.1%, 86.7%]）。达不到闸 = 如实报数字，不许调判据凑。
