# baselines/reach/scripted-phases.yaml — reach@v1 × 4 轴解析 IK 相位机（金标采集路）
method: scripted-phases
task_id: reach@v1
entry: >
  cargo run -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf --
  --task reach --episodes 12 --runs-root runs
presets:
  - name: tabletop-4dof-pick      # task.id 由 --task 覆盖为 reach@v1
    spec: crates/oriera-embodied/specs/official/tabletop-4dof-pick.json
    gate: 0.90                    # course@v1 硬闸（实测 100%）
eval: { protocol: course@v1, episodes: 12, seed0: 1000, success_criteria: v1, verify_determinism: full }
train: { seeds: null }
hyperparams: { ik: analytic-4dof, phases: reach_phases, dwell_ticks: [70, 70, 400] }
reference: out/m0b/runs/e3177646/scripted-pea4667a8/1000/eval_report.json   # M0b 实测 6/6（本地产物示例）
