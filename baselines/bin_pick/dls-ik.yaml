# baselines/bin_pick/dls-ik.yaml — bin_pick@v1 × DLS 数值 IK 相位机（M2 新任务首版）
method: dls-ik
task_id: bin_pick@v1
entry: >
  cargo run -p oriera-agent --example embodied_sim_baseline --features rigid3d,spec,urdf --
  --spec crates/oriera-agent/specs/official/bin-pick-4dof.json --protocol course@v1
  --reference-out results/reference
presets:
  - name: bin-pick-4dof
    spec: crates/oriera-agent/specs/official/bin-pick-4dof.json
    gate: 0.60                    # 新任务首版诚实门槛（料箱 prop 近似）
eval:
  protocol: course@v1
  episodes: 12
  seed0: 1000
  success_criteria: v2            # 出箱到目标区 + 松爪 + 静止
  verify_determinism: full
train:
  seeds: null
hyperparams:
  ik: { solver: damped-least-squares, rows: 6, rot_weight: 0.5, lambda: 0.05, max_step_rad: 0.3 }
  phases: pick_phases             # 与 pick 同一套 8 相（箱内抓 → 提 0.20 越墙 → 箱外放）
  dwell_ticks: [70, 60, 40, 70, 95, 70, 35, 45]
  bin: { walls: 4, wall_height_m: 0.06, wall_density: 6000, inner_x: [0.09, 0.27], inner_z: [-0.10, 0.10] }
reference: results/reference/<spec_hash8>/course_v1.json
notes: >
  TODO(WP-A 集成)：spec 自碰撞开关落地后重验箱内抓取；真料箱 fixture（四壁+底）在 M3——
  现用重墙 prop 近似，墙被撞动不影响判据（判据只看任务物体）。
