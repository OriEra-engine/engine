<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OriEra · 06 Agent Physics</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: ui-monospace, "SF Mono", Menlo, monospace;
         background:#0b0d12; color:#e6e8ee; height:100vh; display:flex; flex-direction:column;}
  header { padding:12px 20px; border-bottom:1px solid #222633;
           display:flex; justify-content:space-between; align-items:center;}
  header h1 { font-size:14px; margin:0; }
  header .tag { font-size:11px; color:#8a90a6; }
  main { flex:1; display:grid; grid-template-columns: 360px 1fr; overflow:hidden;}
  #chat { border-right:1px solid #222633; display:flex; flex-direction:column;}
  #messages { flex:1; overflow-y:auto; padding:14px;}
  .msg { margin-bottom:12px; max-width:92%; }
  .msg.user { margin-left:auto; }
  .msg .who { font-size:10px; color:#8a90a6; margin-bottom:3px; text-transform:uppercase;}
  .msg .bubble { padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.5;}
  .msg.user .bubble { background:#1f2a44; color:#cfe0ff; }
  .msg.agent .bubble { background:#1a1f2a; }
  .msg.tool .bubble { background:#14291c; color:#7fd18a; font-size:11px;}
  #input-row { padding:10px; border-top:1px solid #222633; display:flex; gap:8px;}
  #input { flex:1; background:#12151c; border:1px solid #2a3040; color:#e6e8ee;
           padding:8px; border-radius:6px; font:inherit; font-size:13px;}
  #send { background:#5b8def; border:none; color:white; padding:0 14px; border-radius:6px;
          font:inherit; cursor:pointer;}
  #scene { position:relative; }
  canvas { width:100%; height:100%; background:#0a0d14; display:block; cursor:grab;}
  #hud { position:absolute; top:10px; left:10px; font-size:11px; color:#8a90a6;
         background:rgba(0,0,0,0.6); padding:5px 8px; border-radius:4px;}
</style>
</head>
<body>
<header>
  <h1>OriEra · Agent × Physics — 用自然语言指挥物理世界</h1>
  <span class="tag">example/06-agent-physics</span>
</header>
<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="input-row">
      <input id="input" placeholder="试试：左边放 5 个方块 / 扔 3 个球 / 清空 / 加大重力" />
      <button id="send">发送</button>
    </div>
  </section>
  <section id="scene">
    <canvas id="canvas"></canvas>
    <div id="hud">bodies: 0</div>
  </section>
</main>

<script type="module">
// ============================================================
//  L6 物理世界（复用 03 的实现）
// ============================================================
let GRAVITY = 0.3;
const REST = 0.4, FRICTION = 0.98;

class Body {
  constructor(x, y, r, type) {
    Object.assign(this, {x, y, vx:0, vy:0, r, type,
      color: `hsl(${Math.random()*360},70%,60%)`, dragging:false});
  }
}
class World {
  constructor() { this.bodies = []; }
  add(b) { this.bodies.push(b); }
  clear() { this.bodies = []; }
  step(w, h, dt) {
    for (const b of this.bodies) {
      if (b.dragging) continue;
      b.vy += GRAVITY * dt;
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.y+b.r > h) { b.y = h-b.r; b.vy *= -REST; b.vx *= FRICTION; }
      if (b.x-b.r < 0) { b.x = b.r; b.vx *= -REST; }
      if (b.x+b.r > w) { b.x = w-b.r; b.vx *= -REST; }
    }
    for (let i=0;i<this.bodies.length;i++) for (let j=i+1;j<this.bodies.length;j++) {
      const a=this.bodies[i], b=this.bodies[j];
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
      if (d<min && d>0) {
        const nx=dx/d, ny=dy/d, ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
        const dvx=b.vx-a.vx, dvy=b.vy-a.vy, dot=dvx*nx+dvy*ny;
        if (dot<0) { const imp=-dot*REST; a.vx-=imp*nx; a.vy-=imp*ny; b.vx+=imp*nx; b.vy+=imp*ny; }
      }
    }
  }
  render(ctx) {
    for (const b of this.bodies) {
      ctx.fillStyle = b.color;
      if (b.type==="box") ctx.fillRect(b.x-b.r, b.y-b.r, b.r*2, b.r*2);
      else { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
    }
  }
  hitTest(mx,my) {
    for (let i=this.bodies.length-1;i>=0;i--) {
      const b=this.bodies[i];
      if (Math.hypot(mx-b.x,my-b.y)<b.r) return b;
    }
    return null;
  }
}

// ============================================================
//  L9 MCP 工具注册表
// ============================================================
const world = new World();
let W = 800, H = 600;

const tools = {
  spawn_boxes: {
    desc: "在指定位置放 N 个方块",
    handler: ({count=3, side="center"}) => {
      let x0 = W/2;
      if (side === "left") x0 = W*0.25;
      if (side === "right") x0 = W*0.75;
      for (let i=0;i<count;i++) {
        world.add(new Body(x0 + (Math.random()-0.5)*60, 40+i*50, 18, "box"));
      }
      return `在${side==="left"?"左边":side==="right"?"右边":"中间"}放了 ${count} 个方块`;
    }
  },
  spawn_balls: {
    desc: "扔 N 个球",
    handler: ({count=3}) => {
      for (let i=0;i<count;i++) {
        world.add(new Body(W*Math.random(), 30+i*40, 14+Math.random()*8, "ball"));
      }
      return `扔了 ${count} 个球`;
    }
  },
  clear_world: {
    desc: "清空场景",
    handler: () => { world.clear(); return "场景已清空"; }
  },
  set_gravity: {
    desc: "调整重力（1 正常，0 月球，2 木星）",
    handler: ({factor=1}) => { GRAVITY = 0.3 * factor; return `重力调到 ${factor}x`; }
  }
};

// 意图解析
function parseIntent(text) {
  const t = text.toLowerCase();
  let m;
  if (m = t.match(/(\d+)\s*个方块/)) {
    let side = "center";
    if (t.includes("左")) side = "left";
    if (t.includes("右")) side = "right";
    return { tool: "spawn_boxes", args: { count: +m[1], side } };
  }
  if (m = t.match(/(\d+)\s*个球/)) return { tool: "spawn_balls", args: { count: +m[1] } };
  if (t.includes("清空") || t.includes("clear")) return { tool: "clear_world", args: {} };
  if (m = t.match(/重力.*?(\d+\.?\d*)/)) return { tool: "set_gravity", args: { factor: +m[1] } };
  return null;
}

// ============================================================
//  Chat UI
// ============================================================
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
function addMsg(who, text, type="normal") {
  const div = document.createElement("div");
  div.className = `msg ${who} ${type==="tool"?"tool":""}`;
  div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
addMsg("agent", "你好！试试这些指令：\n• 左边放 5 个方块\n• 扔 3 个球\n• 重力调到 0.3（月球）\n• 清空");
function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMsg("user", text); inputEl.value = "";
  const intent = parseIntent(text);
  if (!intent) { addMsg("agent", "没听懂，换个说法试试。"); return; }
  const result = tools[intent.tool].handler(intent.args);
  addMsg("tool", `→ ${intent.tool}(${JSON.stringify(intent.args)})`, "tool");
  addMsg("agent", result);
}
sendBtn.onclick = send;
inputEl.onkeydown = e => { if (e.key==="Enter") send(); };

// ============================================================
//  Canvas + 帧循环
// ============================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
let dragged = null, dragOff = {x:0,y:0};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width*dpr; canvas.height = r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W = r.width; H = r.height;
}
window.addEventListener("resize", resize);
requestAnimationFrame(() => { resize(); world.add(new Body(W/2, 50, 20, "box")); });

canvas.addEventListener("mousedown", e => {
  const r = canvas.getBoundingClientRect();
  dragged = world.hitTest(e.clientX, e.clientY - r.top);
  if (dragged) { dragged.dragging = true; dragged.vx=dragged.vy=0; dragOff.x=dragged.x-e.clientX; dragOff.y=dragged.y-(e.clientY-r.top); }
});
canvas.addEventListener("mousemove", e => {
  if (!dragged) return;
  const r = canvas.getBoundingClientRect();
  dragged.x = e.clientX + dragOff.x;
  dragged.y = e.clientY - r.top + dragOff.y;
});
window.addEventListener("mouseup", () => { if (dragged) { dragged.dragging=false; dragged=null; } });

let last = performance.now();
function frame(now) {
  const dt = Math.min((now-last)/16.666, 2);
  last = now;
  world.step(W, H, dt);
  ctx.fillStyle = "#0a0d14"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#2a3040";
  ctx.beginPath(); ctx.moveTo(0,H-1); ctx.lineTo(W,H-1); ctx.stroke();
  world.render(ctx);
  hud.textContent = `bodies: ${world.bodies.length} · gravity: ${(GRAVITY/0.3).toFixed(1)}x`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
