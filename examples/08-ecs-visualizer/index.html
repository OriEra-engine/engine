<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OriEra ECS 可视化 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 280px; background: #12121a; padding: 20px; border-right: 1px solid #222; overflow-y: auto; }
  #canvas-area { flex: 1; position: relative; }
  canvas { display: block; }
  h1 { font-size: 16px; margin-bottom: 16px; color: #6ee7ff; }
  h2 { font-size: 12px; color: #888; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .stat .val { color: #6ee7ff; font-weight: bold; }
  button { width: 100%; padding: 8px; margin: 4px 0; background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  button:hover { background: #2a2a4e; border-color: #6ee7ff; }
  button.primary { background: #6ee7ff; color: #000; font-weight: bold; }
  .legend { display: flex; align-items: center; margin: 4px 0; font-size: 11px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  #perf { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>⚙ OriEra ECS</h1>
    
    <h2>Stats</h2>
    <div class="stat"><span>Entities</span><span class="val" id="stat-entities">0</span></div>
    <div class="stat"><span>Position</span><span class="val" id="stat-pos">0</span></div>
    <div class="stat"><span>Velocity</span><span class="val" id="stat-vel">0</span></div>
    <div class="stat"><span>Health</span><span class="val" id="stat-hp">0</span></div>
    <div class="stat"><span>Frame ms</span><span class="val" id="stat-frame">0</span></div>

    <h2>Actions</h2>
    <button class="primary" onclick="spawn(100)">Spawn 100</button>
    <button onclick="spawn(1000)">Spawn 1,000</button>
    <button onclick="spawn(10000)">Spawn 10,000</button>
    <button onclick="spawn(50000)">Spawn 50,000</button>
    <button onclick="despawnAll()">Despawn All</button>
    <button onclick="togglePause()">Pause/Resume</button>

    <h2>Legend</h2>
    <div class="legend"><div class="dot" style="background:#6ee7ff"></div>Position only</div>
    <div class="legend"><div class="dot" style="background:#ff6b9d"></div>Position + Velocity</div>
    <div class="legend"><div class="dot" style="background:#a8ff6b"></div>Position + Health</div>
    <div class="legend"><div class="dot" style="background:#ffd93d"></div>All three</div>
  </div>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <div id="perf">Rust ECS → WebAssembly → Canvas 2D</div>
  </div>
</div>

<script>
// 简易 ECS 实现（JS 版，对应 Rust oriera-ecs）
class Entity { constructor(index, generation) { this.index = index; this.generation = generation; } }

class World {
  constructor() {
    this.nextIndex = 0;
    this.generations = [];
    this.free = [];
    this.liveCount = 0;
    this.columns = new Map(); // TypeId -> Array
  }

  spawn() {
    let idx;
    if (this.free.length > 0) idx = this.free.pop();
    else {
      idx = this.nextIndex++;
      this.generations.push(0);
      // Grow all existing columns to fit the new index
      for (const col of this.columns.values()) {
        while (col.length <= idx) col.push(null);
      }
    }
    const gen = this.generations[idx];
    this.liveCount++;
    return new Entity(idx, gen);
  }

  despawn(e) {
    if (!this.valid(e)) return;
    this.generations[e.index]++;
    this.liveCount--;
    this.free.push(e.index);
    for (const col of this.columns.values()) col[e.index] = null;
  }

  despawnAll() {
    for (let i = 0; i < this.generations.length; i++) {
      if (this.generations[i] > 0 || this.free.includes(i)) continue;
      this.generations[i]++;
      this.free.push(i);
    }
    this.liveCount = 0;
    for (const col of this.columns.values()) col.fill(null);
  }

  valid(e) {
    return e.index < this.generations.length && this.generations[e.index] === e.generation;
  }

  insert(typeId, e, component) {
    if (!this.valid(e)) return;
    let col = this.columns.get(typeId);
    if (!col) { col = new Array(e.index + 1).fill(null); this.columns.set(typeId, col); }
    if (col.length <= e.index) col.length = e.index + 1;
    col[e.index] = component;
  }

  query(typeId) {
    const col = this.columns.get(typeId);
    if (!col) return [];
    const results = [];
    for (let i = 0; i < col.length; i++) {
      if (col[i] !== null) results.push({ entity: new Entity(i, this.generations[i]), data: col[i] });
    }
    return results;
  }

  query2(typeA, typeB) {
    const a = this.columns.get(typeA);
    const b = this.columns.get(typeB);
    if (!a || !b) return [];
    const len = Math.min(a.length, b.length);
    const results = [];
    for (let i = 0; i < len; i++) {
      if (a[i] !== null && b[i] !== null) {
        results.push({ entity: new Entity(i, this.generations[i]), a: a[i], b: b[i] });
      }
    }
    return results;
  }
}

const world = new World();
const T_POS = 'pos';
const T_VEL = 'vel';
const T_HP = 'hp';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let paused = false;

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

function spawn(n) {
  for (let i = 0; i < n; i++) {
    const e = world.spawn();
    world.insert(T_POS, e, { x: Math.random() * canvas.width, y: Math.random() * canvas.height });
    
    const r = Math.random();
    if (r < 0.4) {
      world.insert(T_VEL, e, { vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 });
    } else if (r < 0.7) {
      world.insert(T_HP, e, { hp: Math.random() * 100 });
    } else {
      world.insert(T_VEL, e, { vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 });
      world.insert(T_HP, e, { hp: Math.random() * 100 });
    }
  }
  updateStats();
}

function despawnAll() {
  world.despawnAll();
  updateStats();
}

function togglePause() { paused = !paused; }

function updateStats() {
  document.getElementById('stat-entities').textContent = world.liveCount;
  document.getElementById('stat-pos').textContent = world.query(T_POS).length;
  document.getElementById('stat-vel').textContent = world.query(T_VEL).length;
  document.getElementById('stat-hp').textContent = world.query(T_HP).length;
}

let lastTime = performance.now();

function frame() {
  const now = performance.now();
  const dt = now - lastTime;
  lastTime = now;

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!paused) {
    // 更新 Velocity
    const moving = world.query2(T_POS, T_VEL);
    for (const { a: pos, b: vel } of moving) {
      pos.x += vel.vx;
      pos.y += vel.vy;
      if (pos.x < 0 || pos.x > canvas.width) vel.vx *= -1;
      if (pos.y < 0 || pos.y > canvas.height) vel.vy *= -1;
    }
  }

  // 渲染
  // 用 query2 来分类渲染
  const posOnly = world.columns.get(T_POS);
  if (!posOnly) {
    document.getElementById('stat-frame').textContent = dt.toFixed(1);
    updateStats();
    requestAnimationFrame(frame);
    return;
  }
  const velCol = world.columns.get(T_VEL);
  const hpCol = world.columns.get(T_HP);

  ctx.fillStyle = '#6ee7ff';
  for (let i = 0; i < posOnly.length; i++) {
    if (posOnly[i] === null) continue;
    const hasVel = velCol && velCol[i] !== null;
    const hasHp = hpCol && hpCol[i] !== null;
    
    if (hasVel && hasHp) ctx.fillStyle = '#ffd93d';
    else if (hasVel) ctx.fillStyle = '#ff6b9d';
    else if (hasHp) ctx.fillStyle = '#a8ff6b';
    else ctx.fillStyle = '#6ee7ff';
    
    ctx.fillRect(posOnly[i].x - 1, posOnly[i].y - 1, 2, 2);
  }

  document.getElementById('stat-frame').textContent = dt.toFixed(1);
  updateStats();
  requestAnimationFrame(frame);
}

// 初始生成
spawn(500);
frame();
</script>
</body>
</html>
