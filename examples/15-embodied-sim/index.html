<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OriEra · 15 Embodied Sim</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "rapier": "./vendor/rapier.mjs"
  }
}
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-monospace, "SF Mono", Menlo, monospace;
         background:#0b0d12; color:#e6e8ee; height:100vh; display:flex; flex-direction:column;}
  header { padding:12px 18px; border-bottom:1px solid #222633;
           display:flex; justify-content:space-between; align-items:center; gap:12px;}
  header h1 { font-size:14px; margin:0; }
  header .tag { font-size:11px; color:#8a90a6; }
  #toolbar { padding:8px 14px; border-bottom:1px solid #222633; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button { background:#1f2a44; color:#cfe0ff; border:1px solid #2a3040;
           padding:7px 12px; border-radius:6px; font:inherit; font-size:12px; cursor:pointer;}
  button:hover { background:#2a3a5a; }
  button.primary { background:#5b8def; border-color:#5b8def; color:white; }
  button.rec { background:#7a2d3a; border-color:#a04050; color:#ffd9df; }
  #hud { margin-left:auto; font-size:11px; color:#8a90a6; text-align:right; line-height:1.5;}
  #main { flex:1; display:flex; min-height:0; }
  #viewport { flex:1; min-width:0; position:relative; }
  canvas { display:block; }
  #side { width:290px; border-left:1px solid #222633; padding:12px; overflow:auto; font-size:12px; }
  #side h3 { font-size:12px; margin:14px 0 6px; color:#9fb6e8; }
  .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .row label { width:104px; color:#8a90a6; }
  .row input[type=range] { flex:1; }
  .row .val { width:52px; text-align:right; color:#cfe0ff; }
  #log { white-space:pre-wrap; color:#8a90a6; font-size:11px; max-height:180px; overflow:auto;
         background:#0a0d14; border:1px solid #1a2030; border-radius:6px; padding:8px; }
  .kbd { color:#ffd479; }
  #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:#0b0d12; z-index:5; flex-direction:column; gap:10px;}
  #load .msg { color:#8a90a6; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>OriEra · L6 rigid3d — 具身仿真台（桌面抓放）</h1>
  <span class="tag">example/15-embodied-sim · JS 镜像内核 ↔ Rust oriera_agent::embodied_env 契约</span>
</header>
<div id="toolbar">
  <button class="primary" id="btn-reset">↺ 重置（随机种子）</button>
  <button id="btn-policy">▶ 脚本策略演示（IK 抓放）</button>
  <button id="btn-rec" class="rec">● 开始录制</button>
  <button id="btn-export">⤓ 导出 episode → Studio</button>
  <div id="hud">初始化中…</div>
</div>
<div id="main">
  <div id="viewport">
    <div id="load"><div class="msg">正在加载 rapier3d 物理内核（首次约 2 秒）…</div></div>
  </div>
  <div id="side">
    <h3>关节遥操作 <span class="kbd">Q/A W/S E/D R/F</span></h3>
    <div id="joints"></div>
    <h3>夹爪 <span class="kbd">Space</span></h3>
    <div class="row"><label>开 合</label><input type="range" id="j-grip" min="0" max="1" step="0.05" value="0"><span class="val" id="v-grip">开</span></div>
    <h3>任务</h3>
    <div style="color:#8a90a6;line-height:1.7">把 <b style="color:#ffd479">方块</b> 抓起来放到
      <b style="color:#7be0a0">绿色目标圈</b>。9cm 落区内即成功。<br>奖励：接近 → 抓住 → 提升 → 送达。</div>
    <h3>采集日志</h3>
    <div id="log">（尚未录制）</div>
  </div>
</div>
<script type="module">
  import { boot } from "./engine/kernel.js";
  boot(document.getElementById("viewport"));
</script>
</body>
</html>
