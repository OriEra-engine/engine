[package]
name = "oriera-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OriEra L9 agent layer: cognition systems, long-term memory, AI director, NL intent"

[lib]
name = "oriera_agent"
path = "src/lib.rs"
# The `python` feature builds the same lib as the `oriera_sim`
# extension module; without it the cdylib stays empty (harmless).
crate-type = ["rlib", "cdylib"]

[dependencies]
oriera-common.workspace = true
oriera-core.workspace = true
oriera-ecs.workspace = true
oriera-genai.workspace = true
oriera-infer.workspace = true
serde = { workspace = true, features = ["derive"] }
# ADR 0004 (PLAN-embodied-v3 P2): the embodied simulation runtime
# (`embodied_env`/`spec`/`urdf`/`meshres`/`lerobot`/`eval`/`ik`/
# `manifest`) lives in `oriera-embodied`; THIS crate is the cognition
# face (cognition/memory/story/genai bridge) and re-exports the
# embodied surface for path compatibility (`oriera_agent::spec::…`
# keeps resolving — lib.rs "compatibility layer"). The dep is NOT
# optional: `python.rs` (the PyO3 gymnasium bridge, cdylib
# `oriera_sim`) and the harness examples build against it on every
# leg, mirroring how studio_e2e (CI, featureless) uses the base L6
# subsys below — which itself pulls zero external deps until a backend
# feature is on.
oriera-embodied = { workspace = true }
# L6 physics (PLAN-embodied-sim): the 2D embodied recorder
# (`embodied.rs`, #80) and the `embodied_collect` example read L6
# state (Gravity / RigidBodySystem) directly. The embodied_env 3D
# runtime reaches L6 through `oriera-embodied` instead (ADR 0004).
oriera-subsys = { workspace = true }
# PyO3 gymnasium bridge (feature `python`): the cdylib `oriera_sim`
# is built from this crate's lib — the bridge stays here so the
# extension-module artifact keeps its name; the env it drives comes
# from `oriera-embodied`.
pyo3 = { workspace = true, optional = true }
# MemoryStore ↔ JSON (feature `json`): the persistence boundary for
# cross-session companion memory. Optional like genai's `providers`
# feature — wasm budget stays minimal unless the shell asks for it.
serde_json = { workspace = true, optional = true }

[features]
default = []
json = ["dep:serde_json"]
# Passthrough to the L6 crate: examples/tests opt into the rapier2d
# backend through THIS feature (required-features).
rigid = ["oriera-subsys/rigid"]
# 3D articulated backend — forwards to `oriera-embodied` (ADR 0004),
# which forwards to oriera-subsys/rigid3d. The embodied feature set on
# this crate is a pure compatibility shim: external legs
# (`-p oriera-agent --features rigid3d,cam,spec,urdf`) keep working.
rigid3d = ["oriera-embodied/rigid3d"]
# Top-down / spec-declared camera track (PNG frames).
cam = ["oriera-embodied/cam"]
# PyO3 gymnasium bridge (cdylib `oriera_sim`): online training loops.
# `spec` 挂上：python 侧 `from_spec` 走 SceneSpec 加载（schema v2 / v1
# 迁移）。`oriera-embodied/python` keeps `manifest::feature_list()`
# receipts listing `python` exactly as before the split (ADR 0004).
python = ["dep:pyo3", "pyo3/abi3-py310", "rigid3d", "cam", "spec", "oriera-embodied/python"]
# SceneSpec（实验即文件）：serde 化场景描述 + JSON 加载。Feature
# algebra preserved from the pre-split crate: enabling `spec` here
# still turns on this crate's `rigid3d` + `json` flags.
spec = ["rigid3d", "json", "oriera-embodied/spec"]
# URDF 导入：机器人描述文件 → 关节链 → ArmDescription（M1 设计稿落地）。
# roxmltree/serde_json live on `oriera-embodied` now (ADR 0004).
urdf = ["rigid3d", "oriera-embodied/urdf"]

[dev-dependencies]
oriera-render = { path = "../oriera-render" }
# golden fixture tests (#98) read contracts/golden/*.json on every test leg
serde_json = { workspace = true }

[[example]]
name = "tool_loop"
path = "examples/tool_loop.rs"
required-features = ["json"]

[[example]]
name = "cafe"
path = "examples/cafe.rs"

[[example]]
name = "studio_e2e"
path = "examples/studio_e2e.rs"

# P0-5 headless 验证回路 CLI（方案 A 最小竖切，G5/G6/G7-部分）：固定
# 场景 → 固定步数物理 → 三段分账 JSON。json 必列：分账结构经
# serde_json 序列化打印（同 tool_loop 的 required-features 惯例）。
[[example]]
name = "headless_loop"
path = "examples/headless_loop.rs"
required-features = ["json"]

# #80: rapier2d comes from oriera-subsys' `rigid` feature — the
# example only builds when that (and json, unused here but kept for
# symmetry with the collection harness docs) is enabled.
[[example]]
name = "embodied_collect"
path = "examples/embodied_collect.rs"
required-features = ["rigid"]

# PLAN-embodied-sim: the 3D pick-and-place collection harness —
# IK-scripted baseline policy × PickPlace3D × LeRobot v2.1 export,
# double-run bit-equality asserted.
[[example]]
name = "embodied_sim_collect"
path = "examples/embodied_sim_collect.rs"
# spec+urdf 必列：example 引用门控模块 oriera_agent::{spec,urdf}；
# 缺列时凡开 rigid3d 的腿构建 examples 即 E0433（PR #165 三红腿根因）。
required-features = ["rigid3d", "spec", "urdf"]

# M2: DLS 数值 IK 基线（PLAN-embodied-general §四 M2 / §9.1 P-11）——
# 五预设 × course@v1 × 任务专属闸；同款理由必列 required-features
# （引用 oriera_agent::{spec, ik, urdf}）。
[[example]]
name = "embodied_sim_baseline"
path = "examples/embodied_sim_baseline.rs"
required-features = ["rigid3d", "spec", "urdf"]

# M3-A（PLAN §四 M3 / §9.1 U-5）：spec 相机采集 + 标定自检——针孔管线
# 多 RGB/depth 视频轨 + 三点×N 相机重投影 <2px 门槛。引用
# oriera_agent::{spec, manifest, embodied_env::CameraShot}，同款理由必列
# required-features。
[[example]]
name = "embodied_cam_capture"
path = "examples/embodied_cam_capture.rs"
required-features = ["rigid3d", "cam", "spec"]

# MJCF 全量交叉验证（out/mjcf-crosscheck，scripts/mjcf_crosscheck.py）：
# 把 UrdfReport 逐关节/逐 link + validate_chain 报告序列化为 JSON。
# 同款理由必列 required-features——example 引用门控模块 oriera_agent::urdf。
[[example]]
name = "urdf_chain_dump"
path = "examples/urdf_chain_dump.rs"
required-features = ["urdf"]
