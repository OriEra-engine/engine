[package]
name = "oriera-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OriEra L7 inference runtime: command queue, execution site routing"

[lib]
name = "oriera_infer"
path = "src/lib.rs"

[dependencies]
oriera-common.workspace = true
oriera-core.workspace = true
oriera-ecs.workspace = true
oriera-subsys.workspace = true
tracing.workspace = true
# #68 native HTTP adapter (feature `native-http`, design discussions/78):
# ureq blocking client + serde_json for request/response shapes. Both
# optional — wasm budget and default builds stay exactly as they were.
ureq = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
native-http = ["dep:ureq", "dep:serde_json"]
