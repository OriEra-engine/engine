[package]
name = "oriera-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OriEra L7 inference runtime: command queue, execution site routing"

[lib]
name = "oriera_infer"
path = "src/lib.rs"

[dependencies]
oriera-common.workspace = true
oriera-core.workspace = true
oriera-ecs.workspace = true
oriera-subsys.workspace = true
tracing.workspace = true
# #68 native HTTP adapter (feature `native-http`, design discussions/78):
# ureq blocking client + serde_json for request/response shapes. Both
# optional — wasm budget and default builds stay exactly as they were.
# recipe-core 依赖已移除（#106 两轮评审共识：仅用 ReasoningEffort 的
# wire 形状，本地 as_str() 逐字节等价且有 wire 测试钉死，proc-macro
# 供应链面不值得；A1 的「官方协议层」由测试锁定的 wire 快照承接）。
ureq = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
native-http = ["dep:ureq", "dep:serde_json"]

[dev-dependencies]
# golden fixture test (#98) reads contracts/golden/presets.json on every test leg
serde_json = { workspace = true }
