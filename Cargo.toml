[workspace]
resolver = "2"
# Layer order, bottom-up. L8/L10/L11 land with the ROADMAP stages.
members = [
    "crates/oriera-common",  # L0
    "crates/oriera-pal",     # L1
    "crates/oriera-core",    # L2
    "crates/oriera-ecs",     # L3
    "crates/oriera-asset",   # L4
    "crates/oriera-render",  # L5
    "crates/oriera-subsys",  # L6
    "crates/oriera-infer",   # L7
    "crates/oriera-agent",   # L9
    "platforms/pc",
]
exclude = [
    "platforms/web",
    "platforms/ar_glasses/android_spatial",
    "platforms/bci_reserved",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["OriEra Contributors"]
repository = "https://github.com/OriEra-engine/engine"

# Only versions actually shared by current crates are pinned here.
# Add entries (glam, tokio, serde, ...) when the layer that needs them lands.
[workspace.dependencies]
bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
