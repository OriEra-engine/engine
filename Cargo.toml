[workspace]
resolver = "2"
# Layer order, bottom-up. L10/L11 land with the ROADMAP stages.
members = [
    "crates/oriera-common",  # L0
    "crates/oriera-pal",     # L1
    "crates/oriera-core",    # L2
    "crates/oriera-ecs",     # L3
    "crates/oriera-asset",   # L4
    "crates/oriera-render",  # L5
    "crates/oriera-subsys",  # L6
    "crates/oriera-infer",   # L7
    "crates/oriera-genai",   # L8 (ADR 0003)
    "crates/oriera-agent",   # L9
    "platforms/pc",
]
exclude = [
    "platforms/web",
    "platforms/ar_glasses/android_spatial",
    "platforms/bci_reserved",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["OriEra Contributors"]
repository = "https://github.com/OriEra-engine/engine"

# Only versions actually shared by current crates are pinned here.
# Add entries (glam, tokio, ...) when the layer that needs them lands.
# Internal layer crates: path for workspace builds, version for `cargo publish`.
[workspace.dependencies]
oriera-common = { path = "crates/oriera-common", version = "0.3.0" }
oriera-pal = { path = "crates/oriera-pal", version = "0.3.0" }
oriera-core = { path = "crates/oriera-core", version = "0.3.0" }
oriera-ecs = { path = "crates/oriera-ecs", version = "0.3.0" }
oriera-asset = { path = "crates/oriera-asset", version = "0.3.0" }
oriera-render = { path = "crates/oriera-render", version = "0.3.0" }
oriera-subsys = { path = "crates/oriera-subsys", version = "0.3.0" }
oriera-infer = { path = "crates/oriera-infer", version = "0.3.0" }
oriera-genai = { path = "crates/oriera-genai", version = "0.3.0" }
oriera-agent = { path = "crates/oriera-agent", version = "0.3.0" }
bitflags = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# L7 native HTTP adapter (feature `native-http`, #68): blocking client
# fits System::run's synchronous shape — no async runtime enters L7.
# rustls via webpki-roots, no native TLS, no compression extras.
ureq = { version = "2.10", default-features = false, features = ["tls"] }
# A1 (PLAN-deepseek-upgrade): DeepSeek 官方协议类型层（conversation/
# ReasoningEffort 等），MIT。只取 core——主 crate 拖 tokenizers/jsonschema
# 且无 feature 可关，core 仅依赖 macros+serde+serde_json，近乎零增量。
# caret 0.2 = 锁 0.2.x，上游 0.3 升级走独立 commit 留观察窗。
# 已知边界（2026-10-21 安全评审）：当前仅用 ReasoningEffort 的官方
# 序列化形状（本地 as_str() 等价）——去依赖化是候选项，待创始人拍板
# （A1 拍板的是「直接依赖官方协议层」，删除需重新拍板）。
deepseek-recipe-core = "0.2"
# L6 rigid backend (#80): pure Rust, Apache-2.0, 2026 roadmap targets
# robotics accuracy. Feature-gated per crate (`rigid`).
rapier2d = "0.36"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
