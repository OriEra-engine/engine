name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent physics command regression tests
        run: node --test examples/06-agent-physics/intent.test.mjs

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Test (genai providers feature)
        run: cargo test -p oriera-genai --features providers
      - name: Test (agent json feature)
        run: cargo test -p oriera-agent --features json
      - name: Test (infer native-http feature)
        run: cargo test -p oriera-infer --features native-http
      - name: Test (subsys rigid feature)
        run: cargo test -p oriera-subsys --features rigid
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (genai providers feature)
        run: cargo clippy -p oriera-genai --all-targets --features providers -- -D warnings
      - name: Clippy (agent json feature)
        run: cargo clippy -p oriera-agent --all-targets --features json -- -D warnings
      - name: Clippy (infer native-http feature)
        run: cargo clippy -p oriera-infer --all-targets --features native-http -- -D warnings
      - name: Clippy (subsys+agent rigid feature)
        run: cargo clippy -p oriera-subsys --all-targets --features rigid -- -D warnings
      - name: Clippy (agent rigid example)
        run: cargo clippy -p oriera-agent --all-targets --features rigid -- -D warnings

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: LayerManifest gate
        run: python scripts/check_manifests.py

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ECS benchmarks (report-only)
        run: cargo bench -p oriera-ecs

  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # native-http deliberately rejects Wasm and needs native TLS build tools.
      - name: Cross-compile portable engine features (no device linking)
        run: cargo check --workspace --exclude oriera-pc --exclude oriera-web --features oriera-genai/providers,oriera-agent/json,oriera-agent/rigid --target ${{ matrix.target }}
      - name: Browser Wasm host
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p oriera-web --target wasm32-unknown-unknown

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser capability fallback tests
        run: node --test platforms/web/src/probe.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Browser clock and host smoke tests
        run: wasm-pack test --headless --chrome platforms/web
