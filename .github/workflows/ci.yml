name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 慢测试分层夜间腿（embodied-slow，PLAN-embodied-v3 §二 #20）：
    # #[ignore] 慢层物理长跑只在 nightly 兜底，不进 PR 门禁。
    # LeRobot 真加载冒烟（lerobot-loader，P2-W1-D b 层）同一夜间调度。
    - cron: "23 3 * * *"
  workflow_dispatch: # 指纹矩阵手动触发用（embodied-fingerprints-matrix）+ embodied-slow 手动补跑 + lerobot-loader 可选腿
    inputs:
      matrix_only:
        description: "只跑指纹矩阵（跳过全部常规 job，PLAN-embodied-v3 §二 #18）"
        type: boolean
        default: false
      lerobot_smoke:
        description: "加跑 LeRobot 真加载冒烟腿（b 层：pip 装钉版 lerobot + 真 LeRobotDataset；matrix_only=true 时不跑）"
        type: boolean
        default: false
      lerobot_version:
        description: "lerobot-loader 钉的 lerobot 版本（试新版时改这里；0.7.0 = 首个原生把 16-bit PNG 深度解成毫米的版本）"
        type: string
        default: "0.7.0"

# 同分支新推送取消旧跑：省 runner 分钟，也避免旧红掩盖新绿
# （PLAN-embodied-v3 §二 #18，CI 工程师 P1）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-physics:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent physics command regression tests
        run: node --test examples/06-agent-physics/intent.test.mjs
      - name: Browser kernel v2 tests (node, no browser)
        run: node --test examples/11-ai-cafe/engine/kernel.test.mjs
      - name: Splat JS mirror cross-language golden (node, no browser)
        run: node --test examples/16-gaussian-hall/engine/splat.test.mjs

  # 单 job 串行全 feature 腿时，一条卡死拖死全部（2026-10-26 实测：
  # Windows Test 步骤挂 79 分钟被取消）。拆 matrix 并行：各腿独立
  # runner 互不阻塞，timeout-minutes 硬顶——卡死自动自杀重触发。
  # Build 步骤按腿收窄（PLAN-embodied-v3 §二 #18 P2）：此前每腿
  # `cargo build --workspace`（默认 features）——feature 腿的 test 编译
  # 用的单元它一个都没暖到，纯烧分钟。现按本腿 -p + features 预热，
  # 与 test 同一批编译单元复用（core 腿是 --workspace 全量腿，不动）。
  rust:
    if: inputs.matrix_only != true
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: core
            build: cargo build --workspace
            test: cargo test --workspace
            clippy: cargo clippy --workspace --all-targets -- -D warnings
          - name: genai-providers
            build: cargo build -p oriera-genai --features providers
            test: cargo test -p oriera-genai --features providers
            clippy: cargo clippy -p oriera-genai --all-targets --features providers -- -D warnings
          - name: agent-json
            build: cargo build -p oriera-agent --features json
            test: cargo test -p oriera-agent --features json
            clippy: cargo clippy -p oriera-agent --all-targets --features json -- -D warnings
          - name: infer-native-http
            build: cargo build -p oriera-infer --features native-http
            test: cargo test -p oriera-infer --features native-http
            clippy: cargo clippy -p oriera-infer --all-targets --features native-http -- -D warnings
          - name: subsys-rigid
            build: cargo build -p oriera-subsys --features rigid
            test: cargo test -p oriera-subsys --features rigid
            clippy: cargo clippy -p oriera-subsys --all-targets --features rigid -- -D warnings
          - name: subsys-rigid3d
            build: cargo build -p oriera-subsys --features rigid3d
            test: cargo test -p oriera-subsys --features rigid3d
            clippy: cargo clippy -p oriera-subsys --all-targets --features rigid3d -- -D warnings
          - name: subsys-rigid3d-cam
            build: cargo build -p oriera-subsys --features rigid3d,cam
            test: cargo test -p oriera-subsys --features rigid3d,cam
            clippy: cargo clippy -p oriera-subsys --all-targets --features rigid3d,cam -- -D warnings
          # ADR 0004（oriera-embodied 拆分）：具身面集成测试（slide_drawer/
          # embodied_cam/urdf_robot_spec/gripper_down_smoke）随源码迁到
          # oriera-embodied，本腿跟着改挂 -p oriera-embodied；agent 侧只剩
          # 认知面（agent-json 腿 + core --workspace 腿覆盖）与 python 桥腿。
          - name: embodied-rigid3d-cam
            build: cargo build -p oriera-embodied --features rigid3d,cam
            test: cargo test -p oriera-embodied --features rigid3d,cam
            clippy: cargo clippy -p oriera-embodied --all-targets --features rigid3d,cam -- -D warnings
          # pyo3 桥腿：Windows 下 cdylib+测试二进制并行有已知交互，串行跑
          - name: embodied-spec
            build: cargo build -p oriera-embodied --features spec,urdf,rigid3d,cam,json
            test: cargo test -p oriera-embodied --features spec,urdf,rigid3d,cam,json
            clippy: cargo clippy -p oriera-embodied --all-targets --features spec,urdf,rigid3d,cam,json -- -D warnings
          - name: agent-python-bridge
            build: cargo build -p oriera-agent --features python
            test: cargo test -p oriera-agent --features python -- --test-threads=1
            clippy: cargo clippy -p oriera-agent --all-targets --features python -- -D warnings
    name: rust (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.leg.name }}
      - name: Format
        run: cargo fmt --all --check
      - name: Build (${{ matrix.leg.name }}) — 本腿 -p+features 预热
        run: ${{ matrix.leg.build }}
      - name: Test (${{ matrix.leg.name }})
        # timeout 快速失败护栏（2026-10-26 SOP：挂死测试 10 分钟内变红，
        # 不烧满 job 的 60 分钟硬顶——cancelled 语义模糊且拖累整条流水线）
        run: timeout 600 ${{ matrix.leg.test }}
      - name: Clippy (${{ matrix.leg.name }})
        run: ${{ matrix.leg.clippy }}

  # Windows 常规门禁腿（PLAN-embodied-v3 §二 #18，P1：PR 门禁此前完全不
  # 碰 Windows，而本机是主力开发平台）。check 比 test 便宜（不跑测试），
  # 钉具身 feature 组在 MSVC 下的编译/clippy 干净。ADR 0004 后具身代码
  # 在 oriera-embodied（本体腿），oriera-agent 是兼容壳 + python 桥
  # （同参复验 compat re-export 与 cdylib 编译）。
  windows-check:
    if: inputs.matrix_only != true
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      - name: Check (-p oriera-embodied, embodied features)
        run: cargo check -p oriera-embodied --features rigid3d,cam,spec,urdf,json
      - name: Clippy (-p oriera-embodied, embodied features)
        run: cargo clippy -p oriera-embodied --features rigid3d,cam,spec,urdf,json -- -D warnings
      - name: Check (-p oriera-agent, same features — compat shim + python bridge)
        run: cargo check -p oriera-agent --features rigid3d,cam,spec,urdf,json
      - name: Clippy (-p oriera-agent, same features)
        run: cargo clippy -p oriera-agent --features rigid3d,cam,spec,urdf,json -- -D warnings
      - name: Check (-p oriera-render, render-wgpu — #152 camera+depth base)
        run: cargo check -p oriera-render --features render-wgpu
      - name: Clippy (-p oriera-render, render-wgpu)
        run: cargo clippy -p oriera-render --features render-wgpu --all-targets -- -D warnings
      - name: Check (-p oriera-splat, splat-wgpu — PLAN-splat M1 GPU path)
        run: cargo check -p oriera-splat --features splat-wgpu
      - name: Clippy (-p oriera-splat, splat-wgpu)
        run: cargo clippy -p oriera-splat --features splat-wgpu --all-targets -- -D warnings

  # studio_e2e（离线验收 example）独占一腿：panic 即红（#106），且
  # 避免与其他 feature 腿抢同一个 cargo 锁。
  studio-e2e:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-e2e
      - name: Offline acceptance example (studio_e2e — panic is red, #106)
        run: timeout 900 cargo run -q -p oriera-agent --example studio_e2e

  manifests:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: LayerManifest gate
        run: python scripts/check_manifests.py
      - name: Document number guard (W8)
        run: python scripts/check_numbers.py

  # 三出口 CI 冒烟腿（PLAN-embodied-v3 §二 #14，QA-5 + DE-2）：采集 →
  # npz → converter → selfcheck → aggregate → plot 的 Python 数据管线
  # 此前零 CI、三出口一致性靠人肉。2 集 + debug 构建（速度优先），
  # 全部 pass 才绿。
  # P2-W1-D 并入 LeRobot 加载冒烟 a 层（PR 门禁，零 lerobot/torch 依赖）：
  # v3 树转换后过 `lerobot_load_smoke.py`（emulate：逐条复刻 lerobot v3
  # 读路径——HF 特性↔parquet 列/类型、tasks 索引、episodes 指针、mp4
  # 在位、dataset_to_policy_features、迭代 32 帧）；另采两份相机 v3
  # （腕相机 RGB+深度 + 俯拍；同 spec 经 --set 派生的深度-only 变体，
  # max_steps=90 控时）钉住深度轨元数据 / 深度嵌 parquet / 深度-only
  # 对称三件。依赖只加 imageio[ffmpeg]（mp4 + numpy/Pillow）；刻意不装
  # pandas——转换器无 pandas 回退路径也在门禁里。硬顶 15→25 min（两份
  # 相机采集 + mp4 转码）。
  data-pipeline:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: data-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyarrow + imageio[ffmpeg] (converter / aggregate / camera mp4)
        run: python -m pip install pyarrow imageio imageio-ffmpeg
      - name: Build collect (debug — 2 集冒烟速度优先)
        run: cargo build -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf
      - name: Collect 2 episodes (reach → npz + lerobot-v21 + lerobot-v30)
        run: >
          cargo run -q -p oriera-agent --example embodied_sim_collect
          --features rigid3d,cam,spec,urdf
          -- --task reach --episodes 2 --export npz --lerobot-v3 --out out/smoke
      - name: Convert JSONL → parquet (LeRobot v2.1)
        run: python scripts/jsonl_to_lerobot_v21.py out/smoke/lerobot-v21
      - name: Selfcheck converted v2.1 tree (incl. MANIFEST 对账)
        run: python scripts/lerobot_v3_selfcheck.py --v21 out/smoke/lerobot-v21
      - name: Convert + selfcheck + loader smoke a 层 (LeRobot v3.0, state-only)
        run: |
          python scripts/jsonl_to_lerobot_v21.py out/smoke/lerobot-v30
          python scripts/lerobot_v3_selfcheck.py out/smoke/lerobot-v30
          python scripts/lerobot_load_smoke.py out/smoke/lerobot-v30
      - name: Collect camera v3 (wrist RGB+depth + top RGB; depth-only variant via --set)
        run: |
          cargo run -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf -- \
            --spec crates/oriera-embodied/specs/lab/wrist-cam-demo.json --set max_steps=90 \
            --episodes 2 --cam --cameras-from-spec --lerobot-v3 --gate report --verify-determinism off \
            --out out/smoke-rgbd
          cargo run -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf -- \
            --spec crates/oriera-embodied/specs/lab/wrist-cam-demo.json --set max_steps=90 \
            --set scene.cameras.0.kind.pinhole.channels.rgb=false \
            --episodes 2 --cam --cameras-from-spec --lerobot-v3 --gate report --verify-determinism off \
            --out out/smoke-donly
      - name: Camera trees — v2.1 raw selfcheck + v3 convert/selfcheck/loader smoke a 层
        run: |
          for variant in rgbd donly; do
            python scripts/lerobot_v3_selfcheck.py --v21 out/smoke-$variant/lerobot-v21
            python scripts/jsonl_to_lerobot_v21.py out/smoke-$variant/lerobot-v30
            python scripts/lerobot_v3_selfcheck.py out/smoke-$variant/lerobot-v30
            python scripts/lerobot_load_smoke.py out/smoke-$variant/lerobot-v30
          done
      - name: Aggregate eval_report → results table
        run: python scripts/oriera_results.py aggregate out/smoke --out out/smoke-results/results.csv --format csv
      - name: Plot summary (无 matplotlib 走 CSV 降级)
        run: python scripts/plot_results.py out/smoke-results/results.csv --out-dir out/smoke-results/plots

  # LeRobot 真加载冒烟（P2-W1-D b 层）：装钉版 lerobot（torch 走
  # download.pytorch.org/whl/cpu 的 CPU 轮子——PyPI 默认 Linux torch 带
  # CUDA 依赖链约 2.5 GB）→ 采两份相机 v3（同 data-pipeline）→ 转换 →
  # 真 `LeRobotDataset(root=…, video_backend="pyav")` 加载 + 均匀抽 48 帧
  # 解码（视频 [0,1] / 深度 float32 毫米）+ dataset_to_policy_features
  # （lerobot-train 入口）+ 一个 DataLoader batch。HF_HUB_OFFLINE=1：本地
  # 读失败就地红，不去 Hub 兜底。
  # 选型：装依赖（torch CPU ~200 MB + lerobot[dataset]）是大头，整腿约
  # 10–15 runner-min 且受上游发版节奏影响——不进 PR 门禁（PR 由
  # data-pipeline 的 emulate 读路径复刻兜底）；夜间 schedule 与
  # embodied-slow 同批跑，持续校准 a 层复刻与真 lerobot 不漂；手动
  # dispatch 须显式勾 lerobot_smoke（不让每次指纹/慢测补跑都付装 torch
  # 的钱），可改 lerobot_version 试新版。matrix_only=true 时与其它常规
  # job 一样跳过。
  lerobot-loader:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lerobot_smoke && inputs.matrix_only != true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      LEROBOT_VERSION: ${{ inputs.lerobot_version || '0.7.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: lerobot-loader
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lerobot[dataset] (CPU torch wheels) + converter deps
        run: >
          python -m pip install "lerobot[dataset]==${LEROBOT_VERSION}" imageio imageio-ffmpeg
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Build collect (debug)
        run: cargo build -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf
      - name: Collect camera v3 (wrist RGB+depth + top RGB; depth-only variant via --set)
        run: |
          cargo run -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf -- \
            --spec crates/oriera-embodied/specs/lab/wrist-cam-demo.json --set max_steps=90 \
            --episodes 2 --cam --cameras-from-spec --lerobot-v3 --gate report --verify-determinism off \
            --out out/lr-rgbd
          cargo run -q -p oriera-agent --example embodied_sim_collect --features rigid3d,cam,spec,urdf -- \
            --spec crates/oriera-embodied/specs/lab/wrist-cam-demo.json --set max_steps=90 \
            --set scene.cameras.0.kind.pinhole.channels.rgb=false \
            --episodes 2 --cam --cameras-from-spec --lerobot-v3 --gate report --verify-determinism off \
            --out out/lr-donly
      - name: Convert + selfcheck + real LeRobotDataset load (b 层)
        run: |
          for variant in rgbd donly; do
            python scripts/jsonl_to_lerobot_v21.py out/lr-$variant/lerobot-v30
            python scripts/lerobot_v3_selfcheck.py out/lr-$variant/lerobot-v30
            python scripts/lerobot_load_smoke.py out/lr-$variant/lerobot-v30
            python scripts/lerobot_load_smoke.py --backend lerobot --frames 48 out/lr-$variant/lerobot-v30
          done

  # 慢测试分层夜间腿（PLAN-embodied-v3 §二 #20，QA/DE）：抓取冒烟
  # （4 集双跑 ≈188s）、Contact 接触判据（3×610 tick ≈110s）、panda 7 轴
  # 跟踪（800 tick）这批 `#[ignore = "slow: …"]` 物理长跑不进 PR 门禁
  # （rust 矩阵腿的 `timeout 600` 护栏会杀），由本腿 nightly / 手动
  # dispatch 补跑 `-- --ignored` 兜底，30 分钟硬顶。分层约定见
  # docs/EMBODIED-PIPELINES.md §6.5。
  embodied-slow:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.matrix_only != true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: embodied-slow
      - name: Slow tests (-p oriera-subsys, rigid3d+cam, --ignored)
        run: cargo test -p oriera-subsys --features rigid3d,cam -- --ignored
      - name: Slow tests (-p oriera-embodied, rigid3d+spec+urdf, --ignored)
        run: cargo test -p oriera-embodied --features rigid3d,spec,urdf -- --ignored

  bench:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ECS benchmarks (report-only)
        run: cargo bench -p oriera-ecs
  cross-check:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # native-http deliberately rejects Wasm and needs native TLS build tools.
      - name: Cross-compile portable engine features (no device linking)
        run: cargo check --workspace --exclude oriera-pc --exclude oriera-web --features oriera-genai/providers,oriera-agent/json,oriera-agent/rigid --target ${{ matrix.target }}
      - name: Browser Wasm host
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p oriera-web --target wasm32-unknown-unknown

  browser:
    if: inputs.matrix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser capability fallback tests
        run: node --test platforms/web/src/probe.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Browser clock and host smoke tests
        run: wasm-pack test --headless --chrome platforms/web

  # M3 跨平台指纹矩阵（PLAN-embodied-general §四 M3 / P-10）：三个平台
  # 各跑金标采集，逐集 hash 与 contracts/golden/embodied_fingerprints.
  # v2.json 对拍。f32 数值跨 libm/编译器可能差 1 ulp（M1 native↔wasm
  # 已实证）——当前契约「同平台逐位、跨平台统计一致」：本 job 报告差
  # 异不拦门（continue-on-error），差异超限则按 physics-behavior-change
  # 流程重锚。默认只在 main 手动触发（workflow_dispatch），PR 不跑
  # （三平台 × 金标采集 ≈ 30 分钟成本）。`matrix_only` 派发输入（#18）
  # 跳过全部常规 job 只跑本矩阵；eval_report + receipt + run_manifest
  # 按 OS 归档成 artifact 供离线对账（PLAN-embodied-v3 §二 #17）。
  embodied-fingerprints-matrix:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Golden collection (12 episodes, default preset)
        run: >
          cargo run -q -p oriera-agent --example embodied_sim_collect
          --features rigid3d,cam,spec,urdf
          -- --task pick_place --episodes 12 --out out/fp-matrix
      - name: Compare against v2 golden anchor (banded statistical report)
        shell: bash
        run: |
          python - <<'PY'
          import json, sys

          def load(p):
              with open(p, encoding="utf-8") as f:
                  return json.load(f)

          anchor = load("contracts/golden/embodied_fingerprints.v2.json")
          rep = load("out/fp-matrix/eval_report.json")
          receipt = load("out/fp-matrix/lerobot-v21/meta/oriera_receipt.json")
          pre = load("contracts/golden/embodied_fingerprints.pre-m0a.json")

          seeds = [r["seed"] for r in rep.get("runs", [])]
          n = len(seeds)
          if n == 0 or n % 3:
              print(f"::warning::expected 12 episodes (3 bands x 4), got {n}; "
                    "statistical compare skipped")
              sys.exit(0)
          per = n // 3
          bands = [(k * per, min((k + 1) * per, n)) for k in range(3)]

          run_fp = rep.get("fingerprints", {})
          anchor_fp = anchor.get("fingerprints", {})
          # v1 legacy axis: post-P0-4 receipts name episode_fingerprints_v1;
          # older receipts kept the pre-rename alias episode_state_hashes.
          run_v1_receipt = (receipt.get("episode_fingerprints_v1")
                            or receipt.get("episode_state_hashes") or [])

          views = [
              ("state", run_fp.get("episode_state_hashes") or [],
               anchor_fp.get("episode_state_hashes") or []),
              ("v1", run_fp.get("episode_fingerprints_v1") or [],
               anchor_fp.get("episode_fingerprints_v1") or []),
              ("v2", run_fp.get("episode_fingerprints_v2") or [],
               anchor_fp.get("episode_fingerprints_v2") or []),
              ("v1 receipt vs pre-m0a", [str(x) for x in run_v1_receipt],
               [str(x) for x in pre.get("episode_state_hashes") or []]),
          ]

          run_succ = [bool(r.get("success")) for r in rep.get("runs", [])]
          anchor_succ_eps = anchor.get("successes_per_episode")
          warn = []

          print(f"[{sys.platform}] fingerprint matrix - banded statistical report "
          f"(report-only, PLAN-embodied-v3 #17)")
          print(f"  episodes={n} seeds {seeds[0]}..{seeds[-1]} - anchor successes "
          f"{anchor.get('successes')}/{n} - run successes {sum(run_succ)}/{n}")
          print(f"  {'view':<24} {'match':>7} {'rate':>8}  band1  band2  band3")
          for name, got, want in views:
              got = [str(x) for x in got]
              want = [str(x) for x in want]
              if len(got) != n or len(want) != n:
                  print(f"  {name:<24} {'n/a':>7} {'n/a':>8}  "
                  f"(length mismatch: run {len(got)} vs anchor {len(want)})")
                  warn.append(f"{name}: run/anchor episode count mismatch "
                  f"({len(got)} vs {len(want)})")
                  continue
              ok = [a == b for a, b in zip(got, want)]
              cells = []
              for lo, hi in bands:
                  m = sum(ok[lo:hi])
                  cells.append(f"{m}/{hi - lo}" + ("" if m == hi - lo else " x"))
              rate = sum(ok) / n
              print(f"  {name:<24} {sum(ok):>4}/{n:<3}{rate:>6.1%}  {'   '.join(cells)}")
              flips = [f"ep{i + 1}(seed {seeds[i]})" for i in range(n) if not ok[i]]
              if flips:
                  print(f"      mismatched episodes: {', '.join(flips)}")
              if rate < 0.90:
                  warn.append(f"{name}: per-episode hash match rate {sum(ok)}/{n} "
                  f"({rate:.1%}) < 90%")
          # 成功率差（单位 = 集，非百分点）：钉死的锚只落 successes 总数；
          # 逐带差需要锚带 successes_per_episode（下次 physics-behavior-change
          # 重锚时由 reanchor 工具补上）。
          d_total = abs(anchor.get("successes", 0) - sum(run_succ))
          if isinstance(anchor_succ_eps, list) and len(anchor_succ_eps) == n:
              per_band = []
              for lo, hi in bands:
                  a = sum(1 for x in anchor_succ_eps[lo:hi] if x)
                  d = abs(a - sum(run_succ[lo:hi]))
                  per_band.append(str(d))
                  if d > 1:
                      warn.append(f"band seeds {seeds[lo]}..{seeds[hi - 1]}: "
                      f"success rate diff {d} > 1 episode")
              print(f"  success delta per band (anchor-run): "
              f"{' '.join(per_band)} episodes - total delta {d_total}")
          else:
              print(f"  success delta total (anchor-run): {d_total} episodes - "
              "per-band: n/a (pinned anchor records the successes total only)")
              if d_total > 1:
                  warn.append(f"success count differs by {d_total} episodes (>1)")
          if warn:
              for w in warn:
                  print(f"::warning::[{sys.platform}] {w} - cross-platform drift under the "
                  "same-platform-bit-exact contract (report-only, does not gate); "
                  "re-anchor via physics-behavior-change if the statistical "
                  "distribution also drifts")
          else:
              print(f"[{sys.platform}] statistical compare clean: every view >=90% "
              "match, success delta <= 1 episode")
          PY
      - name: Upload eval_report + receipt + run_manifest (per-OS artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-matrix-${{ matrix.os }}
          path: |
            out/fp-matrix/eval_report.json
            out/fp-matrix/run_manifest.json
            out/fp-matrix/lerobot-v21/meta/oriera_receipt.json
          if-no-files-found: warn
