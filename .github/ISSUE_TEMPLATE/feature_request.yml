name: 🚀 功能 / 增强
description: 提一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不好用？谁受影响？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的提案
      description: 你想怎么做？有什么备选？
  - type: dropdown
    id: layer
    attributes:
      label: 涉及层
      options:
        - L1 PAL
        - L2 核心系统
        - L3 对象模型 (ECS)
        - L4 资产管线
        - L5 渲染
        - L6 子系统
        - L7 推理运行时
        - L8 生成式 AI
        - L9 Agent
        - L10 交互
        - L11 应用/UGC
        - 横切（观测/安全/计量）
        - 仓库工程
    validations:
      required: true
  - type: checkboxes
    id: rfc
    attributes:
      label: 是否需要走 RFC？
      options:
        - label: 我同意如果这是跨层/动契约的改动，先开 RFC 讨论再写代码
