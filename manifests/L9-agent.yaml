apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L9
  name: agent
  owner: ai-team
spec:
  provides:
    - id: oriera.agent.intent.v1
      contract: rust:oriera_agent::parse
      stability: stable
    - id: oriera.agent.genai-intent.v1
      contract: rust:oriera_agent::genai::parse_generation
      stability: stable
      note: NL → GenerationRequest bridge into L8 (rule-based v1,
        negation-aware); apps try generation first, commands second
    - id: oriera.agent.embodied-recorder.v1
      contract: rust:oriera_agent::embodied::{EpisodeRecorder,Observation,Transition}
      stability: stable
      note: world-as-benchmark data export (#80) — LeRobotDataset v3
        aligned JSONL (episode_index/step_index/observation.state/
        action.continuous/next_observation.state/reward/done) plus
        meta/info.json carrying per-episode World::state_hash receipts;
        hand-serialized numeric rows, zero new dependencies
    - id: oriera.agent.memory-json.v1
      contract: rust:oriera_agent::MemoryStore::{to_json,from_json}
      stability: stable
      note: cross-session memory persistence pair (#70); optional
        feature `json` (serde_json), mirrors genai `providers` gating;
        to_json emits agents sorted so output is stable/diffable;
        from_json is Result-based and never panics; the 60-per-agent
        sliding window applies to imports as to live writes
    - id: oriera.agent.prefab.v1
      contract: "rust:oriera_agent::prefab::{PrefabSpec,spawn_prefab_at}"
      stability: proto
      note: entity prefabs (F1, PLAN-godot-fusion) — Godot PackedScene
        translated to the ECS world (a reusable cast/prop bundle
        instantiated in deterministic declaration order; same spec
        twice gives a bit-identical world via state_hash); Mood folded
        via Mood::from_label (unknown authoring strings fall back to
        Neutral, never panic)
    - id: oriera.agent.cadence.v1
      contract: rust:oriera_agent::{WakeEvent,CognitionSystem}
      stability: stable
      note: attention metronome (v0.4) — under budget
        pressure the speak interval stretches by 1/throttle (cap 8x);
        a WakeEvent (player touched the world) restores base cadence
        instantly; utterance content is never touched
    # ── embodied simulation runtime (ADR 0004: lives in the
    # `oriera-embodied` crate; `oriera_agent::` paths keep resolving via
    # the compat re-export) ──
    - id: oriera.embodied.env.v1
      contract: rust:oriera_embodied::embodied_env::{EmbodiedEnv,TableTopEnv,TaskKind}
      stability: stable
      note: Gymnasium-signature table-top env — reset/step/(obs, reward,
        terminated, truncated, success); spec-driven task family behind
        a versioned registry; deterministic tick + per-episode fingerprint
    - id: oriera.embodied.spec.v1
      contract: rust:oriera_embodied::spec::SceneSpec
      stability: stable
      note: experiment-as-a-file (oriera.scene/2) — serde scene spec,
        extends overlays against specs/official/, spec_hash identity;
        presets library ships at crates/oriera-embodied/specs/
    - id: oriera.embodied.eval.v1
      contract: rust:oriera_embodied::eval::evaluate
      stability: stable
      note: versioned evaluation protocols (course@v1 / paper@v1) —
        one evaluate() entry shared by CLI / Python / wasm
    - id: oriera.embodied.export.v1
      contract: rust:oriera_embodied::lerobot::LeRobotV21
      stability: stable
      note: LeRobotDataset v2.1/v3 export + run_manifest provenance
        (manifest::write_run_manifest); urdf/meshres/ik support the
        robot-import and N-DoF baseline paths
  requires:
    - id: oriera.infer.runtime.v1
      optional: false   # produces Command values
    - id: oriera.genai.provider.v1
      optional: false   # produces GenerationRequest values

  budgets:
    parse_p99_ms: 0.1    # rule-based v1; LLM budget lands with model routing

  degrade:
    - when: intent_unmatched
      action: return_unknown   # L7 counts it as rejected; nothing executes
      cooldown_ms: 0

  observability:
    traces: true
    metrics_prefix: oriera_agent_

  notes: |
    v0.1 is a rule parser (spawn/clear/gravity, zh+en, negation-aware).
    Cognition/Director boot self-heals (resource_or_default) and meters
    tokens into UsageMeter. LLM backend, MCP tool registry land
    v0.5–v0.7 (book T12). genai::parse_generation bridges into the L8
    crate (ADR 0003); L10 (interaction) is not created yet — see ROADMAP.
    ADR 0004 (PLAN-embodied-v3 P2): the embodied simulation runtime
    (embodied_env/spec/urdf/meshres/lerobot/eval/ik/manifest) moved to
    the `oriera-embodied` crate — see manifests/L9-embodied.yaml. This
    crate keeps the cognition face and a feature-gated compat re-export
    of every historical embodied path.
