apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L2
  name: core-systems
  owner: core-team
spec:
  provides:
    - id: oriera.core.scheduler.v1
      contract: rust:oriera_core::{Scheduler,System,FrameCtx}
      stability: stable
    - id: oriera.core.timings.v1
      contract: rust:oriera_core::{Scheduler::system_timings,with_budget_ns}
      stability: stable
      note: per-system ms of the last frame; budget from the L1 profile
    - id: oriera.core.allocator.v1
      contract: rust:oriera_core::{BudgetAllocator,AllocatorConfig,Scheduler::grants}
      stability: stable
      note: compute slicing (v0.4) — EWMA cost to floored
        proportional shares, hysteresis throttle via FrameCtx::grants;
        AllocatorConfig::off() is exact pass-through
  requires:
    - id: oriera.common.time.v1
      optional: false
    - id: oriera.common.grants.v1
      optional: false   # FrameCtx carries the grant table (v0.4)

  budgets:
    frame_overhead_ms: 0.1     # scheduler bookkeeping per frame

  degrade:
    - when: frame_time_p99 > budget*1.2
      action: proportional_throttle   # v0.4: BudgetAllocator squeezes
                                       # spenders to share/cost (floored 0.1)

  observability:
    traces: true
    metrics_prefix: oriera_core_

  notes: |
    Generic over the world type W — L2 must not know about L3.
    Deterministic replay (RecordInput/Checkpoint, book T5) is v0.2 scope.
