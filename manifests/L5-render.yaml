apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L5
  name: rendering-kernel
  owner: graphics-team
spec:
  provides:
    - id: oriera.render.frame.v1
      contract: rust:oriera_render::RenderSystem
      stability: stable
    - id: oriera.render.quality.v1
      contract: rust:oriera_render::{Quality,RenderSystem::observe_frame}
      stability: stable
      note: hysteresis governor; over budget -> batch harder, headroom
        -> recover
  requires:
    - id: oriera.core.scheduler.v1
      optional: false
    - id: oriera.ecs.world.v1
      optional: false
  # NOTE: must NOT depend on L6 subsystems (layering violation,
  # fixed in the 2026-10 architecture pass).

  budgets:
    frame_time_p99_ms: 8.0
    draw_calls_max: 4000

  degrade:
    - when: frame_time_p99_ms > 10.0
      action: reduce_shadow_resolution
      cooldown_ms: 500
    - when: vram_peak_mb > budget
      action: evict_neural_lod_cache
      cooldown_ms: 1000
    # ADR 0002: neural refinement is an additive path, never a requirement.
    - when: neural_render_cap_missing   # NEURAL_RENDER_3DGS bit absent
      action: passthrough_rasterization
      cooldown_ms: 0

  observability:
    traces: true
    metrics_prefix: oriera_render_

  notes: |
    v0.1 counts visible Position components as the frame stand-in,
    batched by the adaptive quality tier (SetQuality half of the L5
    contract). Pass graph (BuildFrameGraph/AddPass) and wgpu submission
    land v0.2+ (book T8). A NeuralRefine pass type may join the pass
    graph only after it exists, and must obey ADR 0002 (integer-step
    pacing, bounded display queue, capability-gated passthrough).
