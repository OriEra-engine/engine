apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L6
  name: subsystem-services
  owner: engine-team
spec:
  provides:
    - id: oriera.subsys.physics.v1
      contract: rust:oriera_subsys::{PhysicsSystem,Gravity}
      stability: stable
    - id: oriera.subsys.timescale.v1
      contract: rust:oriera_subsys::TimeScale
      stability: stable
      note: simulation pacing resource, clamped [0,8] inside the step
    - id: oriera.subsys.idle.v1
      contract: rust:oriera_subsys::PhysicsSystem::idle_frames
      stability: stable
      note: provable no-op skip (v0.4) — frozen dt or an
        exactly-still world skips the integration pass bit-identically;
        approximation stays the allocator's business, never physics
  requires:
    - id: oriera.core.scheduler.v1
      optional: false
    - id: oriera.ecs.world.v1
      optional: false
    - id: oriera.ecs.stdcomp.v1
      optional: false

  budgets:
    step_p99_ms: 1.5     # AR glasses budget slice (book T3 §3.5)

  degrade:
    - when: step_p99_ms > budget
      action: fixed_timestep_decimation   # drop sub-steps, keep determinism
      cooldown_ms: 500

  observability:
    traces: true
    metrics_prefix: oriera_subsys_

  notes: |
    Physics is fixed-step, resource-driven (Gravity singleton written by
    L7, read here). Jolt integration and animation/audio/net-sync
    subsystems land 2027 H1 (book T9).
