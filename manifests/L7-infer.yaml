apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L7
  name: inference-runtime
  owner: ai-team
spec:
  provides:
    - id: oriera.infer.runtime.v1
      contract: rust:oriera_infer::{InferSystem,Command}
      stability: stable
    - id: oriera.infer.usage.v1
      contract: rust:oriera_infer::{UsageMeter,ModelProvider::last_usage}
      stability: stable
    - id: oriera.infer.per-entity.v1
      contract: rust:oriera_infer::{Command::Nudge,SpawnedThisFrame}
      stability: stable
      note: per-entity action space (#69) — Nudge adds impulse to ONE
        entity's velocity (dead handle = deterministic no-op);
        SpawnedThisFrame resets each frame and lists this frame's spawn
        handles in replay-identical LCG order; Nudge never coalesces
        (float-sensitive, same rule as Teleport/SetSpeed)
      note: frame-budgeted queue (deferred counter) + token metering
    - id: oriera.infer.adaptive.v1
      contract: rust:oriera_infer::InferSystem
      stability: stable
      note: budget-aware queue (v0.4) — runtime cap scales
        with the L2 grant throttle (min 1 per frame, never starves) and
        submit coalesces provably-safe adjacent duplicates (Spawn sum /
        SetGravity last / Count last; float-sensitive kinds never merge)
  requires:
    - id: oriera.core.scheduler.v1
      optional: false
    - id: oriera.common.grants.v1
      optional: false   # runtime queue budget reads the throttle (v0.4)
    - id: oriera.ecs.world.v1
      optional: false
    - id: oriera.subsys.physics.v1
      optional: false   # Gravity resource

  budgets:
    dispatch_p99_ms: 1.0    # on-device slice of the frame budget

  degrade:
    - when: net_unavailable
      action: local_fallback         # ADR 0001: routing is PAL/L7's own business
      cooldown_ms: 1000
    # ── Neural-rendering runtime invariants (ADR 0002). Normative clauses  ──
    # ── only — the code skeleton lands with the second consumer.         ──
    - when: neural_session_overrun
      action: slow_down_not_catch_up # ADR 0002 §2: never a catch-up burst
      cooldown_ms: 0
    - when: display_queue_full
      action: drop_decoded_display_only # ADR 0002 §2: only decoded frames may drop
      cooldown_ms: 0

  observability:
    traces: true
    metrics_prefix: oriera_infer_

  notes: |
    v0.1 executes structured commands with a deterministic LCG (replayable,
    book T5). Real model routing — SubmitInference, model lifecycle,
    edge/cloud split (book T10) — lands 2027 H2.
    Neural/streaming sessions must obey ADR 0002: integer-step frame pacing
    (target fps divides physics_hz), a bounded display queue, and process
    isolation between engine state and inference.
