apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L0
  name: common-types
  owner: core-team
spec:
  provides:
    - id: oriera.common.time.v1
      contract: rust:oriera_common::{Timestamp,FrameIndex}
      stability: stable
    - id: oriera.common.tokens.v1
      contract: rust:oriera_common::TokenUsage
      stability: stable
      note: shared metering vocabulary; L7 reports, L9 accumulates
    - id: oriera.common.determinism.v1
      contract: rust:oriera_common::DeterminismLevel
      stability: stable
      note: v0.8 replay-promise vocabulary — strict (byte-identical
        offline) / pinned (provider seed, best-effort) / recorded
        (fingerprinted for after-the-fact audit)
    - id: oriera.common.grants.v1
      contract: rust:oriera_common::{ComputeGrant,Grants}
      stability: stable
      note: compute-allocation vocabulary (v0.4); L2 produces one grant
        per system per frame, FrameCtx carries it, spend-hungry systems
        read throttle_of(name); absent entry = unmanaged = full speed
  requires: []   # L0 has no oriera dependencies by definition.

  budgets: {}    # pure data types, no runtime cost

  observability:
    traces: false
    metrics_prefix: ""
