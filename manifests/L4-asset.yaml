apiVersion: oriera.dev/v1
kind: LayerManifest
metadata:
  layer: L4
  name: asset-pipeline
  owner: content-team
spec:
  provides:
    - id: oriera.asset.store.v1
      contract: rust:oriera_asset::{AssetStore,AssetHandle}
      stability: stable
    - id: oriera.asset.hotswap.v1
      contract: rust:oriera_asset::{insert_named,get_named,unload}
      stability: stable
      note: logical-name registry; re-insert atomically swaps payload
        behind the same handle — the landing pad for L8 generation
    - id: oriera.asset.splat_ply.v1
      contract: rust:oriera_asset::ply::{decode_splat_ply,SplatCloud}
      stability: unstable
      note: 3DGS binary_little_endian PLY mapped by property name;
        stores KHR_gaussian_splatting activated values (linear scale and
        opacity, xyzw unit quaternion); length checked before allocating
  requires: []   # in-memory store today; L1 storage streams land v0.2

  budgets:
    load_p99_ms: 5.0

  degrade:
    - when: asset_missing
      action: placeholder_asset
      cooldown_ms: 0

  observability:
    traces: true
    metrics_prefix: oriera_asset_

  notes: |
    v0.1 is a typed in-memory registry. Content-addressed resolve
    (hash-as-identity), prefetch/evict and the six-stage AI generation
    pipeline (book T7) land with L8 work.
